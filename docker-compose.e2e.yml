# Bu yığın yalnızca `pnpm test:e2e` içindir. Host portu ve kalıcı volume içermez.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ahkmes
      POSTGRES_PASSWORD: ahkmes-e2e
      POSTGRES_DB: ahkmes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahkmes -d ahkmes"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ahkmes
      MINIO_ROOT_PASSWORD: ahkmes-e2e
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: AHKMES Test
      LDAP_DOMAIN: ahkmes.test
      LDAP_ADMIN_PASSWORD: admin123

  e2e:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    working_dir: /app/apps/backend
    environment:
      DATABASE_URL: postgresql://ahkmes:ahkmes-e2e@postgres:5432/ahkmes?schema=public
      JWT_SECRET: e2e-test-secret
      SEED_ADMIN_PASSWORD: e2e-admin-password
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ahkmes
      MINIO_ROOT_PASSWORD: ahkmes-e2e
      MINIO_BUCKET: ahkmes-documents
      MINIO_PUBLIC_ENDPOINT: minio
      MINIO_PUBLIC_PORT: "9000"
      LDAP_TEST_HOST: ldap
      LDAP_TEST_PORT: "389"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ldap:
        condition: service_started
    command: >
      sh -c "node scripts/wait-for-tcp.mjs ldap 389 &&
      pnpm exec prisma migrate deploy && pnpm exec prisma db seed && pnpm test:e2e"
