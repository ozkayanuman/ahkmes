name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ahkmes
          POSTGRES_PASSWORD: ahkmes-ci
          POSTGRES_DB: ahkmes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahkmes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ahkmes:ahkmes-ci@localhost:5432/ahkmes?schema=public
      JWT_SECRET: ci-test-secret
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_MODE: demo
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ahkmes
      MINIO_ROOT_PASSWORD: ahkmes-ci
      MINIO_BUCKET: ahkmes-documents
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # GitHub Actions "services:" bloğu servis container'lar için özel komut
      # desteklemez (minio/minio "server /data" argümanı gerektirir) — bu yüzden
      # docker run ile ayrı bir adım olarak başlatılıyor, docker-compose.yml'deki
      # minio servisiyle aynı imaj/komut.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ahkmes -e MINIO_ROOT_PASSWORD=ahkmes-ci \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      # ldap.e2e-spec.ts gercek bir LDAP protokol sunucusuna karsi test eder (mock
      # degil) — fabrikanin kendi Active Directory'sine baglanacak kodun gercekten
      # calistigini kanitlamak icin. osixia/openldap dev/test amacli standart imaj.
      - name: Start test LDAP server
        run: |
          docker run -d --name ahkmes-test-openldap -p 3389:389 \
            -e LDAP_ORGANISATION="AHKMES Test" -e LDAP_DOMAIN="ahkmes.test" \
            -e LDAP_ADMIN_PASSWORD="admin123" \
            osixia/openldap:1.5.0
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/3389) 2>/dev/null && break
            sleep 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ahkmes/shared-types build
      - run: pnpm --filter @ahkmes/backend exec prisma generate
      - run: pnpm --filter @ahkmes/backend exec prisma migrate deploy
      - run: pnpm --filter @ahkmes/backend exec prisma db seed
      - run: pnpm --filter @ahkmes/backend typecheck
      - run: pnpm --filter @ahkmes/backend build
      - run: pnpm --filter @ahkmes/backend test:e2e

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ahkmes/connector typecheck
      - run: pnpm --filter @ahkmes/connector test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ahkmes/shared-types build
      - run: pnpm --filter @ahkmes/web typecheck
      - run: pnpm --filter @ahkmes/web build
      - run: pnpm --filter @ahkmes/web test
