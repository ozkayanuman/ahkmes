services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahkmes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:-ahkmes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahkmes} -d ${POSTGRES_DB:-ahkmes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ahkmes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD .env dosyasinda tanimli olmali}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ahkmes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ahkmes-documents}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahkmes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ahkmes}?schema=public
      BACKEND_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasinda tanimli olmali}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS .env dosyasinda tanimli olmali}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ahkmes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ahkmes-documents}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL .env dosyasinda tanimli olmali}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL .env dosyasinda tanimli olmali}
      APP_VERSION: ${APP_VERSION:-local}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahkmes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ahkmes}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "run", "db:migrate"]

  provision:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahkmes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ahkmes}?schema=public
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:?BOOTSTRAP_TENANT_NAME is required for provisioning}
      BOOTSTRAP_TENANT_CODE: ${BOOTSTRAP_TENANT_CODE:?BOOTSTRAP_TENANT_CODE is required for provisioning}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required for provisioning}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required for provisioning}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?BOOTSTRAP_ADMIN_NAME is required for provisioning}
      BOOTSTRAP_PLANT_NAME: ${BOOTSTRAP_PLANT_NAME:?BOOTSTRAP_PLANT_NAME is required for provisioning}
      BOOTSTRAP_PLANT_CODE: ${BOOTSTRAP_PLANT_CODE:-}
      BOOTSTRAP_LOCALE: ${BOOTSTRAP_LOCALE:-tr}
      BOOTSTRAP_TIMEZONE: ${BOOTSTRAP_TIMEZONE:-Europe/Istanbul}
      BOOTSTRAP_EDITION: ${BOOTSTRAP_EDITION:-PROFESSIONAL}
      BOOTSTRAP_LEGACY_MODULES: ${BOOTSTRAP_LEGACY_MODULES:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "run", "db:provision"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Opsiyonel: gerçek tezgah bağlantısı olmadan varsayılan olarak başlamaz.
  # Açmak için: docker compose --profile connector up
  connector:
    profiles: ["connector"]
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    environment:
      ADAPTER: ${CONNECTOR_ADAPTER:-simulator}
      BACKEND_URL: http://backend:3000
      MACHINE_ID: ${CONNECTOR_MACHINE_ID:-}
      MACHINE_KEY: ${CONNECTOR_MACHINE_KEY:-}
      OPCUA_ENDPOINT_URL: ${CONNECTOR_OPCUA_ENDPOINT_URL:-}
      M80_HOST: ${CONNECTOR_M80_HOST:-}
      M80_PORT: ${CONNECTOR_M80_PORT:-683}
      FANUC_HOST: ${CONNECTOR_FANUC_HOST:-}
      FANUC_PORT: ${CONNECTOR_FANUC_PORT:-8193}
      DURABLE_QUEUE_PATH: ${CONNECTOR_DURABLE_QUEUE_PATH:-/var/lib/ahkmes/edge.queue.json}
      HEALTH_PORT: ${CONNECTOR_HEALTH_PORT:-9464}
    volumes:
      - connector-data:/var/lib/ahkmes
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9464/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
  connector-data:
